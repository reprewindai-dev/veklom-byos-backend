name: Self-Hosted CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://veklom:veklom_ci@localhost:5432/veklom_test
      REDIS_ENABLED: "False"
      APP_ENV: test
      LOCAL_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: veklom
          POSTGRES_PASSWORD: veklom_ci
          POSTGRES_DB: veklom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest --tb=short -q

      - name: Notify on failure
        if: failure()
        run: echo "CI failed on self-hosted runner — check $HOSTNAME"
