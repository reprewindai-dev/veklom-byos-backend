# Veklom BYOS Backend — Nginx reverse proxy
# Routes traffic to FastAPI backend on port 8000
# Exposes /metrics path for Prometheus scraping

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1000;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream backend {
    server backend:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Health check (no rate limit)
    location /health {
      proxy_pass http://backend/health;
      proxy_http_version 1.1;
      access_log off;
    }

    # Auth routes — tighter rate limit
    location ~ ^/api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE streaming inference — no buffering, no timeout
    location /api/v1/v1/exec {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      chunked_transfer_encoding on;
    }

    # All other API routes
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      limit_req_status 429;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 60s;
      proxy_read_timeout 120s;
    }

    # Frontend static files
    location /static/ {
      proxy_pass http://backend/static/;
      proxy_http_version 1.1;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }

    # Root — serve frontend landing
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal Prometheus scrape of nginx-prometheus-exporter (if added)
    location /nginx_status {
      stub_status on;
      allow 172.0.0.0/8;   # Docker network
      deny all;
      access_log off;
    }
  }
}
