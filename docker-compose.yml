# Veklom BYOS Backend — Docker Compose Configuration
# For local development and Coolify deployment reference

version: '3.8'

services:
  # Main FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veklom-api
    expose:
      - "8088"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - PORT=8088
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: veklom-postgres
    environment:
      - POSTGRES_USER=veklom
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided by deployment configuration}
      - POSTGRES_DB=veklom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veklom"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: veklom-redis
    env_file:
      - .env.production
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Background Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veklom-celery-worker
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: celery -A backend.core.celery_app worker --loglevel=info
    restart: unless-stopped
    healthcheck:
      disable: true

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veklom-celery-beat
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A backend.core.celery_app beat --loglevel=info
    restart: unless-stopped
    healthcheck:
      disable: true
  # In production, Ollama should run on the host server via systemd
  ollama:
    image: ollama/ollama:latest
    container_name: veklom-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - local  # Only start with --profile local

volumes:
  postgres_data:
  redis_data:
  ollama_data:
