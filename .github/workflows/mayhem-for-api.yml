# Optional external API fuzzing with ForAllSecure Mayhem for API.
#
# This workflow is deliberately truthful about availability: when MAYHEM_TOKEN
# is not configured it records that the external scan was not run rather than
# failing with a misleading "issues found" result. Canonical repository CI is
# still responsible for build/tests regardless of Mayhem availability.

name: "Mayhem for API"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  mayhem-for-api:
    name: Mayhem for API
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      MAYHEM_TOKEN: ${{ secrets.MAYHEM_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Record unavailable external scanner
        if: env.MAYHEM_TOKEN == ''
        run: |
          echo "Mayhem external scan NOT RUN: repository secret MAYHEM_TOKEN is not configured."
          echo "This is an availability state, not a security-pass claim."

      - name: Build real API image
        if: env.MAYHEM_TOKEN != ''
        run: docker build -t veklom-byos-mayhem:${{ github.sha }} .

      - name: Start real API container
        if: env.MAYHEM_TOKEN != ''
        run: |
          docker run -d --rm \
            --name veklom-byos-mayhem \
            -p 8088:8088 \
            -e PYTHONPATH=/app \
            -e DATABASE_URL="sqlite+aiosqlite:////tmp/mayhem.db" \
            -e REDIS_URL="redis://127.0.0.1:6379/0" \
            -e SECRET_KEY="mayhem-ci-secret-not-production" \
            -e APP_ENV="test" \
            -e ENVIRONMENT="test" \
            veklom-byos-mayhem:${{ github.sha }}

      - name: Wait for OpenAPI endpoint
        if: env.MAYHEM_TOKEN != ''
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8088/openapi.json >/dev/null; then
              echo "API OpenAPI endpoint is ready."
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx 'veklom-byos-mayhem'; then
              echo "API container exited before becoming ready."
              docker logs veklom-byos-mayhem || true
              exit 1
            fi
            sleep 2
          done
          echo "API did not expose /openapi.json within the readiness window."
          docker logs veklom-byos-mayhem || true
          exit 1

      - name: Mayhem for API
        if: env.MAYHEM_TOKEN != ''
        uses: ForAllSecure/mapi-action@v1
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          api-url: http://127.0.0.1:8088
          api-spec: http://127.0.0.1:8088/openapi.json
          duration: 60
          sarif-report: mapi.sarif

      - name: Check whether SARIF was produced
        if: always() && env.MAYHEM_TOKEN != ''
        id: sarif
        shell: bash
        run: |
          if [ -s mapi.sarif ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Mayhem did not produce a SARIF report."
          fi

      - name: Upload SARIF file
        if: always() && env.MAYHEM_TOKEN != '' && steps.sarif.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: mapi.sarif

      - name: Stop API container
        if: always() && env.MAYHEM_TOKEN != ''
        run: docker stop veklom-byos-mayhem >/dev/null 2>&1 || true
