<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloudless Test Site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
      text-align: center;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    h1 { margin-bottom: 10px; }
    p { color: #444; }
    button {
      padding: 12px 20px;
      border: none;
      background: black;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Cloudless Compute Test</h1>
    <p>This entire site runs with ZERO servers, ZERO compute, ZERO backend.</p>
    <button onclick="alert('Still no compute needed!')">Click Me</button>
  </div>
</body>
</html>
