name: Mark Stale Issues & PRs

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  stale:
    runs-on: self-hosted
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been inactive for 30 days and will be closed in 7 days unless there is new activity.'
          stale-pr-message: 'This PR has been inactive for 14 days. Please update or it will be closed in 7 days.'
          close-issue-message: 'Closed due to inactivity. Reopen if still relevant.'
          close-pr-message: 'Closed due to inactivity. Reopen if still relevant.'
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          exempt-issue-labels: 'pinned,security,critical'
          exempt-pr-labels: 'pinned,security,work-in-progress'
