name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 5.78.135.11
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /data/coolify/applications/n13gp1nhrcdp0hvazvbnlxru
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker build -t n13gp1nhrcdp0hvazvbnlxru:${{ github.sha }} .
            sed -i "s#image: 'n13gp1nhrcdp0hvazvbnlxru:[^']*'#image: 'n13gp1nhrcdp0hvazvbnlxru:${{ github.sha }}'#" docker-compose.yaml
            docker compose -f docker-compose.yaml up -d --force-recreate --no-deps n13gp1nhrcdp0hvazvbnlxru-083606963671
            docker rm -f n13gp1nhrcdp0hvazvbnlxru-213557155694 >/dev/null 2>&1 || true
            cat >/data/coolify/proxy/dynamic/veklom.yaml <<'YAML'
            http:
              routers:
                veklom-http:
                  entryPoints:
                    - http
                  rule: "Host(`veklom.com`) || Host(`www.veklom.com`) || Host(`app.veklom.com`) || Host(`api.veklom.com`)"
                  service: veklom
                  priority: 1000
                veklom-https:
                  entryPoints:
                    - https
                  rule: "Host(`veklom.com`) || Host(`www.veklom.com`) || Host(`app.veklom.com`) || Host(`api.veklom.com`)"
                  service: veklom
                  priority: 1000
                  tls:
                    certResolver: letsencrypt
              services:
                veklom:
                  loadBalancer:
                    servers:
                      - url: "http://n13gp1nhrcdp0hvazvbnlxru-083606963671:8088"
            YAML
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' n13gp1nhrcdp0hvazvbnlxru-083606963671 2>/dev/null)" = "healthy" ]; then
                curl -sf http://localhost:8088/health >/dev/null 2>&1 && echo "Deploy successful"
                exit 0
              fi
              sleep 2
            done
            echo "Deploy failed: health did not turn healthy in time"
            docker logs --tail 200 n13gp1nhrcdp0hvazvbnlxru-083606963671 || true
            exit 1
