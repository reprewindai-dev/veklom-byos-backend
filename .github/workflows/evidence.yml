name: Evidence Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run evidence pack
        env:
          TARGET_URL: https://veklom.com
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT: ${{ secrets.POSTHOG_PROJECT }}
          POSTHOG_DISTINCT_ID: ${{ github.actor }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          TX_HASHES: ${{ secrets.TX_HASHES }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x evidence.sh
          ./evidence.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: |
            evidence-*.zip
            evidence-*.zip.sha256
            evidence-*.zip.sig
            evidence-*.zip.cosign
          retention-days: 90
