[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veklom"
version = "1.0.0"
description = "Official Python client for the Veklom governed inference platform."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://veklom.com"
Documentation = "https://docs.veklom.com"
Repository = "https://github.com/reprewindai-dev/veklom-byos-backend"
