name: UACPGemini Memory Stability Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  memory-stability:
    name: Memory Stability Profiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Application Dependencies
        run: |
          pip install -r requirements.txt psutil

      - name: Run Memory Sampler
        run: |
          python tests/rss_sampler.py
