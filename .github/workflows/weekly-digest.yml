name: Weekly Repo Digest

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  digest:
    name: Generate Weekly Summary
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate digest
        uses: actions/github-script@v7
        with:
          script: |
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();

            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since,
              per_page: 100
            });

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              sort: 'updated',
              direction: 'desc',
              per_page: 20
            });

            const closedIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              since,
              per_page: 50
            });

            const body = [
              `## 📊 Weekly Digest — ${new Date().toDateString()}`,
              ``,
              `### Commits this week: ${commits.data.length}`,
              commits.data.slice(0, 10).map(c => `- \`${c.sha.slice(0,7)}\` ${c.commit.message.split('\n')[0]}`).join('\n'),
              ``,
              `### PRs merged/opened this week: ${prs.data.filter(p => new Date(p.updated_at) > new Date(since)).length}`,
              ``,
              `### Issues closed this week: ${closedIssues.data.filter(i => !i.pull_request).length}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Digest — ${new Date().toDateString()}`,
              body,
              labels: ['digest']
            });
