backend:
  - changed-files:
    - any-glob-to-any-file: ['backend/**']

frontend:
  - changed-files:
    - any-glob-to-any-file: ['frontend/**', 'app/**']

ci:
  - changed-files:
    - any-glob-to-any-file: ['.github/**']

docker:
  - changed-files:
    - any-glob-to-any-file: ['Dockerfile', 'docker-compose*.yml']

dependencies:
  - changed-files:
    - any-glob-to-any-file: ['requirements*.txt', 'pyproject.toml', 'package*.json']

docs:
  - changed-files:
    - any-glob-to-any-file: ['*.md', 'docs/**']

security:
  - changed-files:
    - any-glob-to-any-file: ['backend/core/security/**', 'backend/middleware/**']
