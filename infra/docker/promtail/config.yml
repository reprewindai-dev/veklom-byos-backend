# Veklom BYOS Backend — Promtail config
# Ships container logs to Grafana Cloud Loki (prod-ca-east-0)
# Grafana Cloud Loki URL: https://logs-prod-018.grafana.net
# Loki User ID: 1610559
# Auth: basic_auth username=1610559, password=$GRAFANA_API_TOKEN

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

client:
  url: https://logs-prod-018.grafana.net/loki/api/v1/push
  basic_auth:
    username: "1610559"
    password: "${GRAFANA_API_TOKEN}"
  tenant_id: "1610559"
  external_labels:
    env: production
    region: ca-central-1
    app: veklom-byos-backend
  batchwait: 1s
  batchsize: 1048576
  timeout: 10s
  backoff_config:
    min_period: 500ms
    max_period: 5m
    max_retries: 10

scrape_configs:
  # Veklom FastAPI backend container logs
  - job_name: veklom_backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["veklom-backend", "byos-backend"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: job
        replacement: veklom_backend
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            request_id: request_id
            user_id: user_id
            path: path
            status_code: status_code
            duration_ms: duration_ms
      - labels:
          level:
          path:
          status_code:
      - timestamp:
          source: time
          format: RFC3339Nano

  # Postgres container logs
  - job_name: postgres
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["veklom-postgres", "postgres"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: job
        replacement: postgres
      - target_label: service
        replacement: postgres

  # Redis container logs
  - job_name: redis
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["veklom-redis", "redis"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: job
        replacement: redis
      - target_label: service
        replacement: redis

  # Nginx access logs
  - job_name: nginx
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["veklom-nginx", "nginx"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: job
        replacement: nginx
      - target_label: service
        replacement: nginx
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>.+)\] "(?P<method>\S+) (?P<path>\S+) \S+" (?P<status>\d{3}) (?P<body_bytes>\d+)'
      - labels:
          method:
          path:
          status:
