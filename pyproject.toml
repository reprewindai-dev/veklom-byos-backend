[build-system]
requires = ["setuptools>=79.0.1", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "veklom-byos-backend"
version = "1.0.0"
description = "Veklom BYOS Backend — Sovereign AI Hub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.21.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.27",
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
    "pyasn1>=0.6.3",
]

[project.optional-dependencies]
production = [
    "asyncpg>=0.30.0",
    "redis>=6.2.0",
    "stripe>=12.2.0",
    "gunicorn>=22.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
