name: Backend CI — Build & Import Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    name: Docker Build + Import Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t veklom-backend-ci:${{ github.sha }} .

      - name: Validate all Python imports start clean
        run: |
          docker run --rm \
            -e DATABASE_URL="postgresql+asyncpg://test:test@localhost/test" \
            -e REDIS_URL="redis://localhost:6379" \
            -e SECRET_KEY="ci-test-secret-key-not-real" \
            -e ENVIRONMENT="test" \
            veklom-backend-ci:${{ github.sha }} \
            python3 -c "
          import sys, os
          os.environ.setdefault('DATABASE_URL', 'postgresql+asyncpg://test:test@localhost/test')
          os.environ.setdefault('REDIS_URL', 'redis://localhost:6379')
          os.environ.setdefault('SECRET_KEY', 'ci-test-secret-key')
          os.environ.setdefault('ENVIRONMENT', 'test')
          # Just verify all deps are installed — don't actually connect to DB
          import fastapi, uvicorn, sqlalchemy, asyncpg, redis, pydantic
          import jsonschema, cryptography, jwt, celery
          import langchain, langchain_core, httpx, sentry_sdk
          print('All critical imports OK')
          "

      - name: Report
        if: success()
        run: echo "Build and import check passed for ${{ github.sha }}"

  deploy-prod:
    name: Deploy to Production (main branch only)
    needs: build-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/veklom-deploy
          chmod 600 ~/.ssh/veklom-deploy
          ssh-keyscan -H 5.78.135.11 >> ~/.ssh/known_hosts

      - name: Pull, Build, Migrate, and Swap on Server
        run: |
          ssh -i ~/.ssh/veklom-deploy root@5.78.135.11 << 'ENDSSH'
          set -e
          APP=/data/coolify/applications/n13gp1nhrcdp0hvazvbnlxru
          CONTAINER=n13gp1nhrcdp0hvazvbnlxru-213557155694
          IMAGE=veklom-local:latest
          ENVFILE=/data/coolify/applications/n13gp1nhrcdp0hvazvbnlxru/.env

          cd $APP
          git pull origin main

          echo "--- Building image ---"
          docker build -t $IMAGE .

          echo "--- Running Alembic migrations ---"
          docker run --rm \
            --network coolify \
            --env-file $ENVFILE \
            $IMAGE \
            python -m alembic -c backend/db/migrations/alembic.ini upgrade head

          echo "--- Swapping container ---"
          docker stop $CONTAINER  || true
          docker rm   $CONTAINER  || true

          docker run -d \
            --name $CONTAINER \
            --network coolify \
            --env-file $ENVFILE \
            --restart unless-stopped \
            -p 80:80 \
            $IMAGE

          echo "--- Waiting for startup ---"
          sleep 8
          curl -sf http://localhost:80/health && echo "HOST OK" || (echo "HOST FAILED" && exit 1)
          echo "Deploy complete"
          ENDSSH

      - name: Verify Production Health
        run: |
          sleep 12
          for i in 1 2 3; do
            HTTP=$(curl -sk https://api.veklom.com/health -o /dev/null -w '%{http_code}')
            if [ "$HTTP" = "200" ]; then
              echo "api.veklom.com healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: got $HTTP, retrying..."
            sleep 10
          done
          echo "HEALTH CHECK FAILED after 3 attempts"
          exit 1
