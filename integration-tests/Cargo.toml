[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Testing
tokio-test = "0.4"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4"] }

# Cryptography
sha2 = "0.10"
hex = "0.4"

[[test]]
name = "phase0a_tests"
path = "tests/phase0a.rs"

[[test]]
name = "phase0b_tests"
path = "tests/phase0b.rs"

[[test]]
name = "end_to_end_tests"
path = "tests/end_to_end.rs"

[[test]]
name = "security_tests"
path = "tests/security.rs"
