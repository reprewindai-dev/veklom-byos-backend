http:
  routers:
    veklom-api-http:
      entryPoints:
        - http
      rule: "Host(`api.veklom.com`)"
      service: veklom-paid-gateway
      priority: 2000
    veklom-api-https:
      entryPoints:
        - https
      rule: "Host(`api.veklom.com`)"
      service: veklom-paid-gateway
      priority: 2000
      tls:
        certResolver: letsencrypt
    veklom-http:
      entryPoints:
        - http
      rule: "Host(`veklom.com`) || Host(`www.veklom.com`) || Host(`app.veklom.com`)"
      service: veklom
      priority: 1000
    veklom-https:
      entryPoints:
        - https
      rule: "Host(`veklom.com`) || Host(`www.veklom.com`) || Host(`app.veklom.com`)"
      service: veklom
      priority: 1000
      tls:
        certResolver: letsencrypt
  services:
    veklom:
      loadBalancer:
        servers:
          - url: "http://n13gp1nhrcdp0hvazvbnlxru-213557155694:80"
    veklom-paid-gateway:
      loadBalancer:
        servers:
          - url: "http://veklom-paid-gateway:3001"
