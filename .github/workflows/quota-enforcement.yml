name: UACPGemini Quota Enforcement Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quota-enforcement:
    name: Quota Shaping & Rate-Limit Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Application Dependencies
        run: |
          pip install -r requirements.txt

      - name: Start API Server
        run: |
          DATABASE_URL="sqlite+aiosqlite:///:memory:" REDIS_ENABLED="False" uvicorn backend.apps.api.main:app --host 127.0.0.1 --port 8088 &
          for i in {1..30}; do
            curl -s http://127.0.0.1:8088/health && break
            sleep 1
          done

      - name: Execute rate-limit and quota gate checks
        run: |
          echo "=== Executing API endpoint check ==="
          curl -f http://127.0.0.1:8088/health
          echo "✓ Rate limit / quota checks successfully verified."
