name: 'Dependency Review'
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
        
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        with:
          # Block the PR if it introduces vulnerabilities with High/Critical severity
          fail-on-severity: high
          # Explicitly deny GPL family licenses for this commercial/governed platform
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
          # Allow the action to post a summary comment to the PR
          comment-summary-in-pr: always
