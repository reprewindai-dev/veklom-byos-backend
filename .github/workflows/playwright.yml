name: API Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Live API Health & Route Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Health check — api.veklom.com
        run: |
          HTTP=$(curl -sk https://api.veklom.com/health -o /dev/null -w '%{http_code}')
          echo "api.veklom.com/health → $HTTP"
          [ "$HTTP" = "200" ] || { echo "❌ Health check failed"; exit 1; }

      - name: Smoke — unauthenticated 401 gate
        run: |
          HTTP=$(curl -sk https://api.veklom.com/api/v1/workspaces -o /dev/null -w '%{http_code}')
          echo "Unauthenticated /api/v1/workspaces → $HTTP"
          [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ] || { echo "❌ Expected 401/403, got $HTTP"; exit 1; }
          echo "✓ Zero-Trust gate is enforcing — unauthenticated requests blocked"

      - name: Smoke — control plane reachable
        run: |
          HTTP=$(curl -sk https://control.veklom.com -o /dev/null -w '%{http_code}')
          echo "control.veklom.com → $HTTP"
          [ "$HTTP" = "200" ] || { echo "❌ Control plane unreachable"; exit 1; }
          echo "✓ Control plane live"

      - name: Report
        if: success()
        run: echo "✓ All smoke checks passed for ${{ github.sha }}"
