name: Production Health Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: API Health Ping
    runs-on: self-hosted
    steps:
      - name: Check /health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.veklom.com/health || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check FAILED — HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed."

      - name: Check /api/v1/status
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.veklom.com/api/v1/status || echo "000")
          echo "Status endpoint: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Status endpoint returned HTTP $STATUS"
          fi
