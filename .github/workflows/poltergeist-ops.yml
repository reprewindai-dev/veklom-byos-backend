name: Poltergeist Ops Agent

# Poltergeist acts as the autonomous ops agent for Veklom.
# It watches: PRs, deployments, health, and canonicality violations.
# It posts back to the PR/commit so you always know what's happening.

on:
  # PR events — code review assistance
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

  # After the main CI/CD workflow finishes — deployment verification
  workflow_run:
    workflows: ["Backend CI — Build & Import Check"]
    types: [completed]
    branches: [main]

  # Nightly canonical compliance check
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  statuses: write

jobs:

  # -----------------------------------------------------------------------
  # JOB 1: PR Guardian — runs on every PR
  # Reviews the diff for AGENTS.md canonicality violations and posts a
  # summary comment so we know exactly what changed and whether it's safe.
  # -----------------------------------------------------------------------
  pr-guardian:
    name: "👻 Poltergeist PR Guardian"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze Diff for Violations
        id: diff_analysis
        run: |
          set +e

          # Get all changed Python/YAML files
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check for AGENTS.md anti-patterns in changed files
          VIOLATIONS=""

          # Anti-pattern 1: hardcoded Stripe redirect
          if git diff origin/main...HEAD -- '*.py' | grep -q 'res.redirect.*stripe\.com\|redirect.*stripe\.com'; then
            VIOLATIONS="${VIOLATIONS}\n❌ **Hardcoded Stripe redirect detected.** Use \`_build_402_response(\"insufficient_funds\")\` instead."
          fi

          # Anti-pattern 2: tenant_id from request body
          if git diff origin/main...HEAD -- '*.py' | grep -q 'req\.body\.tenant_id\|request\.body.*tenant_id\|body\[.tenant_id.\]'; then
            VIOLATIONS="${VIOLATIONS}\n❌ **Client-supplied tenant_id detected.** Always extract \`workspace_id\` from the signed JWT via PGL."
          fi

          # Anti-pattern 3: console.log for SLA
          if git diff origin/main...HEAD -- '*.py' | grep -q 'print.*SLA missed\|log.*SLA missed'; then
            VIOLATIONS="${VIOLATIONS}\n❌ **Ephemeral SLA logging detected.** Always persist to the VNP Ledger off the hot-path."
          fi

          # Anti-pattern 4: alembic multiple heads risk
          MIGRATION_COUNT=$(git diff --name-only origin/main...HEAD | grep 'migrations/versions' | wc -l)
          if [ "$MIGRATION_COUNT" -gt 1 ]; then
            VIOLATIONS="${VIOLATIONS}\n⚠️ **Multiple migration files changed ($MIGRATION_COUNT).** Verify a single Alembic head is maintained."
          fi

          # Anti-pattern 5: frontend being merged into backend
          if git diff --name-only origin/main...HEAD | grep -q 'frontend/sovereign-control-node\|_next/'; then
            VIOLATIONS="${VIOLATIONS}\n🚨 **CRITICAL: Next.js frontend files detected in backend repo.** AGENTS.md rule #4 — DECOUPLED architecture. Remove immediately."
          fi

          echo "violations<<EOF" >> $GITHUB_OUTPUT
          echo -e "$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Count summary stats
          PY_CHANGED=$(echo "$CHANGED" | grep '\.py$' | wc -l)
          echo "py_changed=$PY_CHANGED" >> $GITHUB_OUTPUT
          echo "migration_count=$MIGRATION_COUNT" >> $GITHUB_OUTPUT

      - name: Post PR Summary Comment
        # GitHub downgrades GITHUB_TOKEN permissions for fork pull requests.
        # The diff analysis still runs, but a comment attempt must not fail CI.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const violations = `${{ steps.diff_analysis.outputs.violations }}`.trim();
            const pyChanged = `${{ steps.diff_analysis.outputs.py_changed }}`;
            const migCount = `${{ steps.diff_analysis.outputs.migration_count }}`;
            const changedFiles = `${{ steps.diff_analysis.outputs.changed_files }}`.trim();

            const hasViolations = violations.length > 0;
            const status = hasViolations ? '⚠️ Issues Found' : '✅ Clean';
            const emoji = hasViolations ? '⚠️' : '✅';

            const body = `## 👻 Poltergeist PR Report ${emoji}

            **Status:** ${status}
            **Python files changed:** ${pyChanged}
            **Migration files:** ${migCount}

            ${hasViolations ? `### Canonicality Violations\n${violations}` : '### No canonicality violations detected.\nThis PR is clear of AGENTS.md anti-patterns.'}

            ---
            <details>
            <summary>Changed Files</summary>

            \`\`\`
            ${changedFiles || 'None'}
            \`\`\`
            </details>

            > 👻 _Poltergeist is watching. Deploy safely._`;

            // Find existing Poltergeist comment and update, or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Poltergeist PR Report')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # -----------------------------------------------------------------------
  # JOB 2: Deployment Verifier — runs after CI/CD completes on main
  # Waits for the production API to come up and posts a deploy receipt.
  # -----------------------------------------------------------------------
  deployment-verifier:
    name: "👻 Poltergeist Deployment Verifier"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10

    steps:
      - name: Wait for API to be healthy
        id: health_check
        run: |
          echo "Waiting for api.veklom.com to come up..."
          MAX_ATTEMPTS=12
          SLEEP=15
          SUCCESS=false

          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP=$(curl -sk https://api.veklom.com/health -o /tmp/health_body.json -w '%{http_code}' --connect-timeout 10 --max-time 15)
            echo "Attempt $i: HTTP $HTTP"

            if [ "$HTTP" = "200" ]; then
              SUCCESS=true
              BODY=$(cat /tmp/health_body.json)
              echo "health_body=$BODY" >> $GITHUB_OUTPUT
              break
            fi
            sleep $SLEEP
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "FAILED — API did not come up after $((MAX_ATTEMPTS * SLEEP))s"
            echo "deploy_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "deploy_success=true" >> $GITHUB_OUTPUT

      - name: Post Deployment Receipt to Commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.health_check.outputs.deploy_success }}' === 'true';
            const body = '${{ steps.health_check.outputs.health_body }}';
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const runUrl = '${{ github.event.workflow_run.html_url }}';

            let bodyText;
            if (success) {
              bodyText = `## 👻 Poltergeist Deploy Receipt ✅

              **api.veklom.com** is live and healthy.

              | Field | Value |
              |---|---|
              | Commit | \`${sha.slice(0, 7)}\` |
              | Status | 🟢 Healthy |
              | Health Response | \`${body.slice(0, 200)}\` |
              | CI Run | [View](${ runUrl }) |

              > 👻 _Poltergeist confirmed deployment at ${new Date().toUTCString()}._`;
            } else {
              bodyText = `## 👻 Poltergeist Deploy Alert 🚨

              **api.veklom.com did NOT come up** after the CI/CD workflow completed.

              | Field | Value |
              |---|---|
              | Commit | \`${sha.slice(0, 7)}\` |
              | Status | 🔴 Dead |
              | CI Run | [View](${ runUrl }) |

              **Poltergeist InfrastructureSentinel is attempting auto-recovery on the server.**

              > 👻 _Poltergeist flagged this deployment as failed at ${new Date().toUTCString()}._`;
            }

            // Post as a commit comment when the token is allowed. Deployment
            // verification must stay green if the repository blocks comments.
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
                body: bodyText,
              });
            } catch (error) {
              core.warning(`Deployment receipt comment skipped: ${error.message}`);
            }

  # -----------------------------------------------------------------------
  # JOB 3: Nightly Health Audit — canonical compliance + disk + alive check
  # -----------------------------------------------------------------------
  nightly-audit:
    name: "👻 Poltergeist Nightly Audit"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    env:
      DISK_ALERT_THRESHOLD_PCT: "88"
      DISK_PRUNE_THRESHOLD_PCT: "90"

    steps:
      - name: Checkout Alert Reconciler
        uses: actions/checkout@v4

      - name: Check All Endpoints
        id: audit
        run: |
          check_endpoint() {
            local key=$1
            local label=$2
            local url=$3
            local expected_code=${4:-200}
            local http
            http=$(curl -sk "$url" -o /dev/null -w '%{http_code}' \
              --connect-timeout 10 --max-time 15 || true)
            if [ "$http" = "$expected_code" ]; then
              echo "✅ $label → HTTP $http"
              echo "${key}_status=ok" >> "$GITHUB_OUTPUT"
            else
              echo "❌ $label → HTTP ${http:-no-response} (expected $expected_code)"
              echo "${key}_status=fail" >> "$GITHUB_OUTPUT"
            fi
          }

          check_endpoint "api_health" "API Health" "https://api.veklom.com/health"
          check_endpoint "agent_discovery" "Agent Discovery" "https://api.veklom.com/.well-known/agent.json"
          check_endpoint "status_page" "Status Page" "https://status.veklom.com"
          check_endpoint "control_plane" "Control Plane" "https://control.veklom.com"

      - name: Disk Usage Check via SSH
        id: disk
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          # Set this repository variable to "false" to disable guarded cleanup.
          POLTERGEIST_AUTO_PRUNE: ${{ vars.POLTERGEIST_AUTO_PRUNE || 'true' }}
        run: |
          set +e

          DISK=""
          PROBE_STATUS="failed"
          PROBE_MESSAGE="Disk probe did not complete."
          PRUNE_STATUS="not-needed"
          KEY_PATH="$HOME/.ssh/veklom-deploy"

          emit_results() {
            echo "disk_used=$DISK" >> "$GITHUB_OUTPUT"
            echo "probe_status=$PROBE_STATUS" >> "$GITHUB_OUTPUT"
            echo "probe_message=$PROBE_MESSAGE" >> "$GITHUB_OUTPUT"
            echo "prune_status=$PRUNE_STATUS" >> "$GITHUB_OUTPUT"
          }

          mkdir -p ~/.ssh
          trap 'rm -f "$KEY_PATH"' EXIT

          if [ -z "$HETZNER_SSH_KEY" ]; then
            PROBE_MESSAGE="HETZNER_SSH_KEY is not configured."
            emit_results
            exit 0
          fi

          printf '%s\n' "$HETZNER_SSH_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          if ! ssh-keyscan -H 5.78.135.11 >> ~/.ssh/known_hosts 2>/dev/null; then
            PROBE_MESSAGE="Could not obtain the server SSH host key."
            emit_results
            exit 0
          fi

          SSH_ARGS=(
            -i "$KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            root@5.78.135.11
          )
          DISK=$(ssh "${SSH_ARGS[@]}" \
            "df -P / | tail -1 | tr -s ' ' | cut -d ' ' -f 5 | tr -d '%'" \
            2>/dev/null)

          if ! [[ "$DISK" =~ ^[0-9]{1,3}$ ]] || [ "$DISK" -gt 100 ]; then
            DISK=""
            PROBE_MESSAGE="SSH succeeded, but df returned an invalid disk percentage."
            emit_results
            exit 0
          fi

          PROBE_STATUS="ok"
          PROBE_MESSAGE="Disk usage measured successfully."
          echo "Disk usage before cleanup: ${DISK}%"

          if [ "$DISK" -ge "$DISK_PRUNE_THRESHOLD_PCT" ]; then
            case "${POLTERGEIST_AUTO_PRUNE,,}" in
              1|true|yes|on)
                ssh "${SSH_ARGS[@]}" \
                  "docker image prune -af --filter until=1440h && docker builder prune -af --filter until=1440h" \
                  >/tmp/poltergeist-prune.log 2>&1
                if [ "$?" -eq 0 ]; then
                  PRUNE_STATUS="succeeded"
                  DISK=$(ssh "${SSH_ARGS[@]}" \
                    "df -P / | tail -1 | tr -s ' ' | cut -d ' ' -f 5 | tr -d '%'" \
                    2>/dev/null)
                  if ! [[ "$DISK" =~ ^[0-9]{1,3}$ ]] || [ "$DISK" -gt 100 ]; then
                    DISK=""
                    PROBE_STATUS="failed"
                    PROBE_MESSAGE="Cleanup succeeded, but the follow-up disk probe was invalid."
                  else
                    echo "Disk usage after cleanup: ${DISK}%"
                  fi
                else
                  PRUNE_STATUS="failed"
                  echo "Automatic Docker cleanup failed:"
                  tail -n 20 /tmp/poltergeist-prune.log
                fi
                ;;
              *)
                PRUNE_STATUS="disabled"
                ;;
            esac
          fi

          emit_results

      - name: Reconcile Nightly Alert
        uses: actions/github-script@v7
        env:
          API_HEALTH_STATUS: ${{ steps.audit.outputs.api_health_status }}
          AGENT_DISCOVERY_STATUS: ${{ steps.audit.outputs.agent_discovery_status }}
          STATUS_PAGE_STATUS: ${{ steps.audit.outputs.status_page_status }}
          CONTROL_PLANE_STATUS: ${{ steps.audit.outputs.control_plane_status }}
          DISK_USED: ${{ steps.disk.outputs.disk_used }}
          DISK_PROBE_STATUS: ${{ steps.disk.outputs.probe_status }}
          DISK_PROBE_MESSAGE: ${{ steps.disk.outputs.probe_message }}
          DISK_PRUNE_STATUS: ${{ steps.disk.outputs.prune_status }}
        with:
          script: |
            const path = require('node:path');
            const reconcilerPath = path.join(
              process.env.GITHUB_WORKSPACE,
              '.github',
              'scripts',
              'poltergeist-nightly-alert.cjs'
            );
            const { reconcileNightlyAlert } = require(reconcilerPath);
            const checks = {
              'API Health': process.env.API_HEALTH_STATUS,
              'Agent Discovery': process.env.AGENT_DISCOVERY_STATUS,
              'Status Page': process.env.STATUS_PAGE_STATUS,
              'Control Plane': process.env.CONTROL_PLANE_STATUS,
            };

            const result = await reconcileNightlyAlert({
              github,
              context,
              checks,
              diskUsed: process.env.DISK_USED,
              diskProbeStatus: process.env.DISK_PROBE_STATUS,
              diskProbeMessage: process.env.DISK_PROBE_MESSAGE,
              pruneStatus: process.env.DISK_PRUNE_STATUS,
              diskAlertThreshold: Number(process.env.DISK_ALERT_THRESHOLD_PCT),
            });
            core.info(`Nightly alert reconciliation: ${result.action}`);
