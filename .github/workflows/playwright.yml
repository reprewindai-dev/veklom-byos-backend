name: API Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Live API Health & Route Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Smoke live endpoints with retry
        run: |
          check_status() {
            local url="$1"
            shift

            for attempt in 1 2 3; do
              local http
              http=$(curl -sk --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$url" || true)
              http="${http:-000}"
              echo "$url returned $http (attempt $attempt/3)"

              for expected in "$@"; do
                [ "$http" = "$expected" ] && return 0
              done

              [ "$attempt" = "3" ] || sleep $((attempt * 3))
            done

            echo "Unexpected status from $url; expected one of: $*"
            return 1
          }

          check_status https://api.veklom.com/health 200
          check_status https://api.veklom.com/api/v1/workspaces 401 403
          check_status https://control.veklom.com 200

      - name: Report
        if: success()
        run: echo "✓ All smoke checks passed for ${{ github.sha }}"
