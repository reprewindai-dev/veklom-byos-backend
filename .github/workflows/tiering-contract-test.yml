name: Cross-Backend Tiering Contract Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contract-test:
    name: Verify ML Tiering Parity (Node 3 & Node 4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Node 4 (veklom-byos-backend-2)
        uses: actions/checkout@v4
        with:
          path: veklom-byos-backend-2

      - name: Checkout Node 3 (cappo-backend)
        uses: actions/checkout@v4
        with:
          repository: reprewindai-dev/cappo-backend
          path: cappo-backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest asyncpg pgvector

      - name: Run Tiering Parity Contract Test
        run: |
          cd veklom-byos-backend-2
          pip install -e .
          # Add backend to PYTHONPATH so imports work
          PYTHONPATH=$PYTHONPATH:$(pwd) pytest backend/tests/contract_tests/test_tiering_parity.py -v
