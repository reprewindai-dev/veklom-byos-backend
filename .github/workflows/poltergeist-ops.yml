name: Poltergeist Ops Agent

# Poltergeist acts as the autonomous ops agent for Veklom.
# It watches: PRs, deployments, health, and canonicality violations.
# It posts back to the PR/commit so you always know what's happening.

on:
  # PR events — code review assistance
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

  # After the main CI/CD workflow finishes — deployment verification
  workflow_run:
    workflows: ["Backend CI — Build & Import Check"]
    types: [completed]
    branches: [main]

  # Nightly canonical compliance check
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  statuses: write

jobs:

  # -----------------------------------------------------------------------
  # JOB 1: PR Guardian — runs on every PR
  # Reviews the diff for AGENTS.md canonicality violations and posts a
  # summary comment so we know exactly what changed and whether it's safe.
  # -----------------------------------------------------------------------
  pr-guardian:
    name: "👻 Poltergeist PR Guardian"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze Diff for Violations
        id: diff_analysis
        run: |
          set +e

          # Get all changed Python/YAML files
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check for AGENTS.md anti-patterns in changed files
          VIOLATIONS=""

          # Anti-pattern 1: hardcoded Stripe redirect
          if git diff origin/main...HEAD -- '*.py' | grep -q 'res.redirect.*stripe\.com\|redirect.*stripe\.com'; then
            VIOLATIONS="${VIOLATIONS}\n❌ **Hardcoded Stripe redirect detected.** Use \`_build_402_response(\"insufficient_funds\")\` instead."
          fi

          # Anti-pattern 2: tenant_id from request body
          if git diff origin/main...HEAD -- '*.py' | grep -q 'req\.body\.tenant_id\|request\.body.*tenant_id\|body\[.tenant_id.\]'; then
            VIOLATIONS="${VIOLATIONS}\n❌ **Client-supplied tenant_id detected.** Always extract \`workspace_id\` from the signed JWT via PGL."
          fi

          # Anti-pattern 3: console.log for SLA
          if git diff origin/main...HEAD -- '*.py' | grep -q 'print.*SLA missed\|log.*SLA missed'; then
            VIOLATIONS="${VIOLATIONS}\n❌ **Ephemeral SLA logging detected.** Always persist to the VNP Ledger off the hot-path."
          fi

          # Anti-pattern 4: alembic multiple heads risk
          MIGRATION_COUNT=$(git diff --name-only origin/main...HEAD | grep 'migrations/versions' | wc -l)
          if [ "$MIGRATION_COUNT" -gt 1 ]; then
            VIOLATIONS="${VIOLATIONS}\n⚠️ **Multiple migration files changed ($MIGRATION_COUNT).** Verify a single Alembic head is maintained."
          fi

          # Anti-pattern 5: frontend being merged into backend
          if git diff --name-only origin/main...HEAD | grep -q 'frontend/sovereign-control-node\|_next/'; then
            VIOLATIONS="${VIOLATIONS}\n🚨 **CRITICAL: Next.js frontend files detected in backend repo.** AGENTS.md rule #4 — DECOUPLED architecture. Remove immediately."
          fi

          echo "violations<<EOF" >> $GITHUB_OUTPUT
          echo -e "$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Count summary stats
          PY_CHANGED=$(echo "$CHANGED" | grep '\.py$' | wc -l)
          echo "py_changed=$PY_CHANGED" >> $GITHUB_OUTPUT
          echo "migration_count=$MIGRATION_COUNT" >> $GITHUB_OUTPUT

      - name: Post PR Summary Comment
        uses: actions/github-script@v7
        with:
          script: |
            const violations = `${{ steps.diff_analysis.outputs.violations }}`.trim();
            const pyChanged = `${{ steps.diff_analysis.outputs.py_changed }}`;
            const migCount = `${{ steps.diff_analysis.outputs.migration_count }}`;
            const changedFiles = `${{ steps.diff_analysis.outputs.changed_files }}`.trim();

            const hasViolations = violations.length > 0;
            const status = hasViolations ? '⚠️ Issues Found' : '✅ Clean';
            const emoji = hasViolations ? '⚠️' : '✅';

            const body = `## 👻 Poltergeist PR Report ${emoji}

            **Status:** ${status}
            **Python files changed:** ${pyChanged}
            **Migration files:** ${migCount}

            ${hasViolations ? `### Canonicality Violations\n${violations}` : '### No canonicality violations detected.\nThis PR is clear of AGENTS.md anti-patterns.'}

            ---
            <details>
            <summary>Changed Files</summary>

            \`\`\`
            ${changedFiles || 'None'}
            \`\`\`
            </details>

            > 👻 _Poltergeist is watching. Deploy safely._`;

            // Find existing Poltergeist comment and update, or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Poltergeist PR Report')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # -----------------------------------------------------------------------
  # JOB 2: Deployment Verifier — runs after CI/CD completes on main
  # Waits for the production API to come up and posts a deploy receipt.
  # -----------------------------------------------------------------------
  deployment-verifier:
    name: "👻 Poltergeist Deployment Verifier"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10

    steps:
      - name: Wait for API to be healthy
        id: health_check
        run: |
          echo "Waiting for api.veklom.com to come up..."
          MAX_ATTEMPTS=12
          SLEEP=15
          SUCCESS=false

          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP=$(curl -sk https://api.veklom.com/health -o /tmp/health_body.json -w '%{http_code}' --connect-timeout 10 --max-time 15)
            echo "Attempt $i: HTTP $HTTP"

            if [ "$HTTP" = "200" ]; then
              SUCCESS=true
              BODY=$(cat /tmp/health_body.json)
              echo "health_body=$BODY" >> $GITHUB_OUTPUT
              break
            fi
            sleep $SLEEP
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "FAILED — API did not come up after $((MAX_ATTEMPTS * SLEEP))s"
            echo "deploy_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "deploy_success=true" >> $GITHUB_OUTPUT

      - name: Post Deployment Receipt to Commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.health_check.outputs.deploy_success }}' === 'true';
            const body = '${{ steps.health_check.outputs.health_body }}';
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const runUrl = '${{ github.event.workflow_run.html_url }}';

            let bodyText;
            if (success) {
              bodyText = `## 👻 Poltergeist Deploy Receipt ✅

              **api.veklom.com** is live and healthy.

              | Field | Value |
              |---|---|
              | Commit | \`${sha.slice(0, 7)}\` |
              | Status | 🟢 Healthy |
              | Health Response | \`${body.slice(0, 200)}\` |
              | CI Run | [View](${ runUrl }) |

              > 👻 _Poltergeist confirmed deployment at ${new Date().toUTCString()}._`;
            } else {
              bodyText = `## 👻 Poltergeist Deploy Alert 🚨

              **api.veklom.com did NOT come up** after the CI/CD workflow completed.

              | Field | Value |
              |---|---|
              | Commit | \`${sha.slice(0, 7)}\` |
              | Status | 🔴 Dead |
              | CI Run | [View](${ runUrl }) |

              **Poltergeist InfrastructureSentinel is attempting auto-recovery on the server.**

              > 👻 _Poltergeist flagged this deployment as failed at ${new Date().toUTCString()}._`;
            }

            // Post as a commit comment when the token is allowed. Deployment
            // verification must stay green if the repository blocks comments.
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
                body: bodyText,
              });
            } catch (error) {
              core.warning(`Deployment receipt comment skipped: ${error.message}`);
            }

  # -----------------------------------------------------------------------
  # JOB 3: Nightly Health Audit — canonical compliance + disk + alive check
  # -----------------------------------------------------------------------
  nightly-audit:
    name: "👻 Poltergeist Nightly Audit"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10

    steps:
      - name: Check All Endpoints
        id: audit
        run: |
          check_endpoint() {
            local label=$1
            local url=$2
            local expected_code=${3:-200}
            HTTP=$(curl -sk "$url" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 15)
            if [ "$HTTP" = "$expected_code" ]; then
              echo "✅ $label → HTTP $HTTP"
              echo "${label}_status=ok" >> $GITHUB_OUTPUT
            else
              echo "❌ $label → HTTP $HTTP (expected $expected_code)"
              echo "${label}_status=fail" >> $GITHUB_OUTPUT
            fi
          }

          check_endpoint "API Health" "https://api.veklom.com/health"
          check_endpoint "Agent Discovery" "https://api.veklom.com/.well-known/agent.json"
          check_endpoint "Status Page" "https://status.veklom.com"
          check_endpoint "Control Plane" "https://control.veklom.com"

      - name: Disk Usage Check via SSH
        id: disk
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/veklom-deploy
          chmod 600 ~/.ssh/veklom-deploy
          ssh-keyscan -H 5.78.135.11 >> ~/.ssh/known_hosts 2>/dev/null

          DISK=$(ssh -i ~/.ssh/veklom-deploy root@5.78.135.11 "df -h / | tail -1 | awk '{print \$5}'" 2>/dev/null)
          echo "disk_used=$DISK" >> $GITHUB_OUTPUT
          echo "Disk usage: $DISK"

      - name: Open Issue if Anything is Down
        uses: actions/github-script@v7
        with:
          script: |
            const diskUsed = '${{ steps.disk.outputs.disk_used }}';
            const checks = {
              'API Health':        '${{ steps.audit.outputs.API_Health_status }}',
              'Agent Discovery':   '${{ steps.audit.outputs.Agent_Discovery_status }}',
              'Status Page':       '${{ steps.audit.outputs.Status_Page_status }}',
              'Control Plane':     '${{ steps.audit.outputs.Control_Plane_status }}',
            };

            const failed = Object.entries(checks).filter(([k,v]) => v === 'fail').map(([k]) => k);
            const diskPct = parseInt(diskUsed);
            const diskHigh = diskPct >= 88;

            if (failed.length === 0 && !diskHigh) {
              console.log('All systems healthy. No issue needed.');
              return;
            }

            const title = `👻 Poltergeist Nightly Alert — ${new Date().toISOString().slice(0,10)}`;
            const body = `## 👻 Poltergeist Nightly Audit Alert

            ${failed.length > 0 ? `### ❌ Down Endpoints\n${failed.map(f => `- **${f}**`).join('\n')}` : ''}
            ${diskHigh ? `\n### ⚠️ Disk Usage High\nServer disk at **${diskUsed}**. Poltergeist DiskWatchdog should auto-prune, but manual review may be needed.` : ''}

            > 👻 _Poltergeist raised this issue at ${new Date().toUTCString()}._`;

            // Check if a Poltergeist issue is already open for today
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'poltergeist-alert',
            });

            const todayIssue = issues.find(i => i.title.includes(new Date().toISOString().slice(0,10)));

            if (!todayIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['poltergeist-alert', 'ops'],
              });
            }
