name: Secret Rotation Guardian

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      force_rotate:
        description: "Comma-separated audited secret names to force into rotation"
        required: false
        type: string
      include_organization_secrets:
        description: "Audit organization secrets available to this repository (requires organization Secrets: read)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  rotation-guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit GitHub Actions secret metadata
        env:
          # Required: a fine-grained token scoped to this repository with Secrets: read.
          GH_TOKEN: ${{ secrets.SECRET_ROTATION_GH_TOKEN }}
          FORCE_ROTATE_SECRETS: ${{ inputs.force_rotate }}
          SECRET_ROTATION_INCLUDE_ORGANIZATION_SECRETS: ${{ inputs.include_organization_secrets || vars.SECRET_ROTATION_INCLUDE_ORGANIZATION_SECRETS || 'false' }}
        run: |
          python backend/scripts/secret_rotation_audit.py \
            --skip-db \
            --report secret-rotation-report.md

      - name: Open or update rotation issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[SECURITY] Secret rotation guardian requires action"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment --repo "$GITHUB_REPOSITORY" "$existing" --body-file secret-rotation-report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file secret-rotation-report.md
          fi

      - name: Upload rotation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-rotation-report
          path: secret-rotation-report.md
          if-no-files-found: error
