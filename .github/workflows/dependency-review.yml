name: Dependency Review

on:
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    name: Scan for Vulnerable Dependencies
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
