[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veklom"
version = "1.1.0"
description = "Official Python client and CLI for the Veklom governed inference platform."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
cli = [
    "colorama>=0.4.6",   # Windows ANSI colours
]

[project.scripts]
veklom = "veklom.cli:main"

[project.urls]
Homepage = "https://veklom.com"
Documentation = "https://docs.veklom.com"
Repository = "https://github.com/reprewindai-dev/veklom-byos-backend"
