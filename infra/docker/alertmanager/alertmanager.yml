# Veklom BYOS Backend — Alertmanager routing config
# Grafana Cloud Alertmanager ID: 1612824
# URL: https://alertmanager-prod-ca-east-0.grafana.net
#
# Env vars required (set in Coolify):
#   SLACK_WEBHOOK_URL   — Slack incoming webhook
#   RESEND_SMTP_KEY     — Resend SMTP key (re_N26pKTux_...)

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.resend.com:587"
  smtp_from: "alerts@veklom.com"
  smtp_auth_username: "resend"
  smtp_auth_password: "${RESEND_SMTP_KEY}"
  smtp_require_tls: true

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: slack-default
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts → Slack #alerts-critical + email
    - matchers:
        - severity = critical
      receiver: critical
      repeat_interval: 1h
      continue: false

    # Kill switch → immediate, no grouping delay
    - matchers:
        - alertname = KillSwitchActivated
      receiver: critical
      group_wait: 0s
      repeat_interval: 30m
      continue: false

    # Audit integrity breach → immediate
    - matchers:
        - alertname = AuditHashChainBroken
      receiver: critical
      group_wait: 0s
      repeat_interval: 30m
      continue: false

    # Billing / wallet alerts → their own channel
    - matchers:
        - service = billing
      receiver: billing
      repeat_interval: 2h
      continue: false

    # Default warning → Slack #alerts-warning
    - matchers:
        - severity = warning
      receiver: slack-default

inhibit_rules:
  # If backend is down, suppress all derivative backend warnings
  - source_matchers:
      - alertname = BackendDown
    target_matchers:
      - service = backend
    equal: ["env"]
  # If Postgres is down, suppress connection count warning
  - source_matchers:
      - alertname = PostgresDown
    target_matchers:
      - service = postgres
    equal: ["env"]

receivers:
  - name: slack-default
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts-warning"
        send_resolved: true
        title: |-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
        text: |-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          {{ end }}
        icon_emoji: ":warning:"

  - name: critical
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts-critical"
        send_resolved: true
        title: |-
          🚨 [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
        text: |-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          {{ end }}
        icon_emoji: ":rotating_light:"
    email_configs:
      - to: "ops@veklom.com"
        from: "alerts@veklom.com"
        smarthost: "smtp.resend.com:587"
        auth_username: "resend"
        auth_password: "${RESEND_SMTP_KEY}"
        headers:
          Subject: "🚨 [Veklom CRITICAL] {{ .CommonLabels.alertname }}"
        html: |-
          <h2>Critical Alert: {{ .CommonLabels.alertname }}</h2>
          {{ range .Alerts }}
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          {{ end }}
        require_tls: true

  - name: billing
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts-billing"
        send_resolved: true
        title: |-
          💰 [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
        text: |-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          {{ end }}
        icon_emoji: ":moneybag:"
