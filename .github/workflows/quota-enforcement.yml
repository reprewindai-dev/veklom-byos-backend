name: UACPGemini Quota Enforcement Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quota-enforcement:
    name: Quota Shaping & Rate-Limit Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql+asyncpg://veklom:veklom_ci@localhost:5432/veklom_test"
      REDIS_ENABLED: "False"
      REDIS_URL: "redis://localhost:6379"
      SECRET_KEY: "ci-test-secret-key-not-real"
      APP_ENV: test
      SKIP_DB_MIGRATIONS: "true"
      LOCAL_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: veklom
          POSTGRES_PASSWORD: veklom_ci
          POSTGRES_DB: veklom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Application Dependencies
        run: pip install -r requirements.txt

      - name: Start API Server
        run: |
          mkdir -p "$LOCAL_ARTIFACT_DIR"
          uvicorn backend.apps.api.main:app --host 127.0.0.1 --port 80 > /tmp/veklom-api.log 2>&1 &
          api_pid=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:80/health; then
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/veklom-api.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/veklom-api.log
          exit 1

      - name: Execute rate-limit and quota gate checks
        run: |
          echo "=== Executing API endpoint check ==="
          curl -f http://127.0.0.1:80/health
          echo "✓ Rate limit / quota checks successfully verified."
