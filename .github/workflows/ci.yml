name: CI — Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
      - name: Install linters
        run: pip install ruff
      - name: Ruff lint changed lines
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi
          python scripts/check_changed_ruff.py --base "$base_sha" --head "$head_sha"

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mypy
        run: pip install mypy
      - name: Run mypy
        run: mypy backend/ --ignore-missing-imports --no-strict-optional || true

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      DATABASE_URL: postgresql+asyncpg://veklom:veklom_ci@localhost:5432/veklom_test
      REDIS_ENABLED: "False"
      APP_ENV: test
      LOCAL_ARTIFACT_DIR: ${{ runner.temp }}/veklom-artifacts

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: veklom
          POSTGRES_PASSWORD: veklom_ci
          POSTGRES_DB: veklom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov
      - name: Run tests with coverage
        run: |
          pytest --tb=short -q --cov=backend --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  security-scan:
    name: Security Scan (Bandit + Safety)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanners
        run: pip install bandit safety
      - name: Bandit SAST scan
        run: bandit -r backend/ -ll -ii --format json -o bandit-report.json || true
      - name: Safety dependency check
        run: safety check --full-report || true
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t veklom-byos-backend:ci-${{ github.sha }} . --no-cache
      - name: Clean up image
        if: always()
        run: docker rmi veklom-byos-backend:ci-${{ github.sha }} || true
