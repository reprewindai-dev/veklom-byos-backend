[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veklom"
version = "0.1.0"
authors = [
  { name="Veklom", email="founder@veklom.com" },
]
description = "Official Python client for the Veklom governed inference platform."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://veklom.com"
